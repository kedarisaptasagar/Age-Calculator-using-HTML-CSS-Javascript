<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    #card{
        padding: 10px;
        background-color: black;
        align-items: center;
        margin-left: 450px;
        margin-top: 50px;
        border-radius: 20px;
        width: 300px;
    }
    body{
        background-color: rgb(168, 93, 93);
        font-family: 'Times New Roman', Times, serif;
        font-weight: bolder;
    }
    input{
        padding: 5px;
        border: none;
        border-radius: 5px;
        background-color: #2a2a2a;
        color: white;
    }
    h2{
        color: white;
        
        
    }
    button{
        padding: 10px;
        border: none;
        border-radius: 10px;
        width: 80px;
        background-color: gold;
    }
    h3{
        color: white;
        font-size: 20px;
        font-weight: bolder;
    }
  </style>
</head>
<body>
    <div id="card">
        <h2>AGE CALCULATOR</h2>
    <input type="date" id="date"><br><br>
    <button onclick="calculate()">calculate</button>
    <h3 id="result"></h3>
    <script>
        function calculate(){
            let bdate=document.getElementById("date").value;
            let pdate=new Date();

            let birth=new Date(bdate);
            let age=pdate.getFullYear()-birth.getFullYear();
            

            document.getElementById("result").innerHTML="Your Age : "+age +" Years";
        }
    </script>
    </div>
</body>
</html>
